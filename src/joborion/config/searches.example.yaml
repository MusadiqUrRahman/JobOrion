# JobOrion search configuration
# Copy to ~/.joborion/searches.yaml and customize for your job search.
# The wizard (joborion init) generates a basic version automatically.
#
# WORKS FOR EVERYONE, ANYWHERE:
# - Set `remote_only: true` under defaults to ONLY find work-from-home / fully
#   remote jobs. Set to false to also include onsite/hybrid roles.
# - Add your own locations, queries, and boards — nothing here is tied to any
#   specific country. Replace the example queries/locations with your own.

# Job boards to search. Pick the ones that work in your country/region:
#   indeed, linkedin, zip_recruiter, bayt, glassdoor, google
# (LinkedIn searches globally. Bayt covers MENA + South Asia. ZipRecruiter is US/Canada.)
boards:
  - indeed
  - linkedin
  - bayt

# Search defaults
defaults:
  results_per_site: 50   # Max results per board per query
  hours_old: 168         # Only jobs posted within this many hours
  distance: 0            # 0 = anywhere within the location; used by some boards
  country_indeed: "pakistan"   # Your country (for Indeed/Glassdoor)
  remote_only: false     # true = ONLY work-from-home / fully remote jobs
  # Search mode controls what gets searched and which jobs pass eligibility:
  #   remote       -> worldwide remote-only jobs (remote_only is forced on)
  #   local        -> only jobs in your home country + configured remote locations
  #   sponsorship  -> international + remote roles you could take (relocation /
  #                   authorized countries from your profile)
  #   all          -> everything; strict profile eligibility still applies
  search_mode: all

# Queries -- each has a query string and priority tier.
# Works for ANY field: put your own role titles here (e.g. 'Accountant',
# 'Registered Nurse', 'Graphic Designer', 'Data Analyst', 'Electrician').
# Tier 1: High-priority exact matches (searched first, highest precision)
# Tier 2: Strong matches, broader scope
# Tier 3: Wide net, high volume, lower precision
queries:
  - query: "Accountant"
    tier: 1
  - query: "Senior Accountant"
    tier: 2
  - query: "Financial Analyst"
    tier: 2

# Locations to search. Each location runs against every query above.
#   remote: true  -> only remote/WFH results (JobSpy + post-filter)
#   remote: false -> includes onsite/hybrid jobs in that location
locations:
  - location: "Remote"
    remote: true
  - location: ""
    remote: false

# Location filtering -- accept/reject patterns for job location text.
# Remote jobs always pass. Non-remote jobs must match an accept pattern
# and must NOT match a reject pattern. Leave empty lists to accept all.
location_accept:
  - "Remote"
  - "Anywhere"
  - "Worldwide"

location_reject_non_remote: []
