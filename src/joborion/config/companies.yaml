# Curated ATS board registry for the ats_boards provider.
# Only companies whose public board slug was verified against the live API are
# listed. Users can add their own companies by copying this pattern.
#
# platform: one of greenhouse | lever | ashby | smartrecruiters
# slug:     board slug used in the platform's public jobs API
# region:   "global" or a country; used for location filtering
# tags:     remote-friendly / sponsorship / hybrid where known
#
# PROFESSION-AGNOSTIC: every ATS board posts ALL roles (finance, HR, sales,
# ops, nursing, design...) for that company, not just engineering. The
# `industries` tag drives the `industries` preference filter in the wizard —
# set your preferred industries there (or in preferences.yaml) and only
# matching companies are searched. Add companies from your own field by
# copying a block and verifying the slug against the public API.

