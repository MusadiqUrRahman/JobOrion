# JobOrion source provider registry
#
# Controls which discovery providers run, in what order, and how many results
# each is allowed to contribute. Providers are executed in ascending priority
# (lowest first). Keep the most reliable/cheapest providers at the top so they
# fill the pool before slower ones add variety.
#
# Per-provider options:
#   - max_results: per-run result cap (0 = unlimited). Excess jobs are trimmed
#     after each run so a single source cannot flood the pool. This is also the
#     main cost lever for LLM-heavy sources like ai_sites.
#   - proxy: <host:port[:user:pass]> for boards that block the datacenter IP.
#     The JOBSPY_PROXY env var overrides this for every provider.
#   - Provider-specific options are documented below each entry.

providers:
  # JobSpy scrape: Indeed, LinkedIn, ZipRecruiter, Glassdoor, Bayt, Google
  # Reliability: high. Cost: free (HTML scraping).
  jobspy:
    enabled: true
    priority: 10
    sites: [indeed, linkedin, zip_recruiter]
    results_per_site: 50
    hours_old: 168

  # Workday ATS portals: employer career sites via the CXS JSON API.
  # Reliability: medium (employers change API shape). Cost: free.
  workday:
    enabled: true
    priority: 20
    employers: config/employers.yaml
    workers: 1

  # Adzuna API: aggregated board with rich salary data.
  # Reliability: high. Cost: free tier (1k requests/day) with an API key.
  # Requires ADZUNA_APP_ID + ADZUNA_APP_KEY in ~/.joborion/.env; without them
  # the provider is skipped gracefully (found=0, no error).
  adzuna:
    enabled: true
    priority: 30
    app_id_env: ADZUNA_APP_ID
    app_key_env: ADZUNA_APP_KEY
    countries: [gb, us, de]
    results_per_query: 50

  # Remote-specific boards: Remotive, RemoteOK, WeWorkRemotely, Jobicy,
  # Arbeitnow, Working Nomads, Hacker News Who is Hiring.
  # Reliability: medium. Cost: free (public JSON feeds, no keys).
  remote_boards:
    enabled: true
    priority: 40
    sources: [remotive, remoteok, wwr, jobicy, arbeitnow, workingnomads, hn]

  # ATS boards: Greenhouse, Lever, Ashby, SmartRecruiters public job feeds.
  # Reliability: medium-high. Cost: free (public JSON APIs).
  ats_boards:
    enabled: true
    priority: 50
    platforms: [greenhouse, lever, ashby, smartrecruiters]

  # AI-site aggregation boards (jobs listed across many ATS portals).
  # Reliability: low. Cost: LLM-heavy (est. ~$0.0006/job).
  ai_sites:
    enabled: true
    priority: 60
    max_results: 25
